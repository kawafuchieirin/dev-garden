name: ブックマーク
description: 気になった記事の URL を inbox に追加する
labels: ["inbox"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://example.com/article
    validations:
      required: true
  - type: input
    id: comment
    attributes:
      label: 一言コメント
      description: なぜ保存したか・何に使えそうか
  - type: input
    id: tags
    attributes:
      label: タグ
      placeholder: "#docker #compose"
