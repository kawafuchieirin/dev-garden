name: Bookmark from issue

# - Issue が作られたら inbox ラベルを付ける（Slack など、ラベルを指定できない経路向け）
# - タイトルが URL の Issue は、URL を本文へ移してタイトルをページタイトルにする（タイトルのリンクはクリックできないため）
# - カテゴリラベル（frontend/backend/infra/ai）が付いたら bookmarks/<category>.md へ追記して Issue を閉じる
# Issue の本文は外部入力のため、${{ }} で run に埋め込まず、スクリプトがイベント JSON から読む

on:
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  # 同時に複数のラベルを付けても push が競合しないよう直列化する
  group: bookmarks
  cancel-in-progress: false

jobs:
  label-inbox:
    if: github.event.action == 'opened' && toJSON(github.event.issue.labels) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label inbox
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}

  move-url-to-body:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: node scripts/normalize-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  add-bookmark:
    if: >-
      github.event.action == 'labeled' &&
      contains(fromJSON('["frontend","backend","infra","ai"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4

      - id: add
        run: node scripts/bookmark-from-issue.mjs

      - name: コミットして push
        if: steps.add.outputs.status == 'added'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "docs: ブックマークを追加 (#$NUMBER)"
          git push
        env:
          FILE: ${{ steps.add.outputs.file }}

      - name: Issue をクローズ
        if: steps.add.outputs.status == 'added' || steps.add.outputs.status == 'duplicate'
        run: |
          if [ "$STATUS" = "added" ]; then
            message="\`$FILE\` に追加しました。"
          else
            message="\`$FILE\` に登録済みのため追加しませんでした。"
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "$message"
        env:
          STATUS: ${{ steps.add.outputs.status }}
          FILE: ${{ steps.add.outputs.file }}

      - name: inbox ラベルを外す
        if: >-
          (steps.add.outputs.status == 'added' || steps.add.outputs.status == 'duplicate') &&
          contains(github.event.issue.labels.*.name, 'inbox')
        run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label inbox

      - name: 失敗を Issue に通知
        if: steps.add.outputs.status == 'error'
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "ブックマークを追加できませんでした: $REASON"
          exit 1
        env:
          REASON: ${{ steps.add.outputs.reason }}
